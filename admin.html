<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LEUIN · 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--cream:#FDF8F1;--chalk:#E7E7FF;--bell:#9699E1;--bell-deep:#4C50B2;--ink:#26274F;--sub:#6C6D92;--line:#E3E3F6;--panel:#F4F4FE;--on-bell:#1F2050;--red:#D9626C;
  --font:'Pretendard Variable',Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Montserrat','Pretendard Variable',Pretendard,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font:14px/1.65 var(--font);padding-bottom:90px;word-break:keep-all}
button{font-family:inherit;color:inherit;cursor:pointer}
ul,ol{list-style:none}
/* 상단 바 */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font-size:16px}
.top .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#status{max-width:340px;font-size:12.5px;color:var(--sub)}
#status.err{color:var(--red);font-weight:700}
#status.ok{color:var(--bell-deep);font-weight:700}
.btn{padding:9px 16px;border:1px solid #D2D3EC;border-radius:10px;background:#fff;font-size:13px;font-weight:700;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--bell)}
.btn.primary{border-color:var(--bell);background:var(--bell);color:var(--on-bell)}
.btn.primary[disabled]{opacity:.5;cursor:wait}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;max-width:840px;margin:18px auto 0;padding:0 20px}
.tabs button{padding:9px 20px;border:1px solid #D5D6EE;border-radius:999px;background:#fff;font-size:13px;font-weight:700}
.tabs button:hover{border-color:var(--bell)}
.tabs button[aria-selected="true"]{border-color:var(--bell);background:var(--bell);color:var(--on-bell)}
main{max-width:840px;margin:16px auto 0;padding:0 20px;display:grid;gap:20px}
.guide{padding:12px 16px;border-radius:12px;background:var(--chalk);color:var(--bell-deep);font-size:12.5px;font-weight:600}

/* 페이지와 같은 섹션 카드 + 네모 번호 제목 */
.sec{padding:32px 30px;border:1px solid var(--line);border-radius:20px;background:#fff}
.sec h2{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sub-title{margin:24px 0 10px;font-size:15px;font-weight:700}
.hint{margin:-8px 0 14px;color:var(--sub);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px;margin-bottom:12px;font-size:12.5px;font-weight:700}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:9px 11px;border:1px solid #D6D7EE;border-radius:9px;background:#fff;color:var(--ink);font:500 14px var(--font)}
input:focus,select:focus,textarea:focus{border-color:var(--bell);outline:2px solid var(--bell);outline-offset:1px}
/* 작성 칸 : 내용이 넘치면 세로 칸이 저절로 늘어남 */
textarea{min-height:44px;resize:none;overflow:hidden}
/* 칸 안에서 바로 고치는 입력 (눈에 안 띄다가 올리면 테두리) */
.ghost,input[type=text].ghost,textarea.ghost{width:100%;padding:4px 7px;border:1px dashed transparent;border-radius:8px;background:transparent;color:inherit;font:inherit;transition:border-color .2s,background .2s}
.ghost:hover,input[type=text].ghost:hover,textarea.ghost:hover{border-color:#C9CAEA}
.ghost:focus,input[type=text].ghost:focus,textarea.ghost:focus{border-color:var(--bell);background:#fff;outline:0}
textarea.ghost{min-height:0;resize:none;overflow:hidden}
.ghost::placeholder{color:#A9AACB}
.tl,.tools{display:flex;gap:4px;flex:none}
.add{display:block;width:100%;margin-top:10px;padding:12px;border:1.5px dashed #C9CAEA;border-radius:14px;background:#fff;color:var(--bell-deep);font-size:13px;font-weight:700}
.add:hover{background:var(--panel)}

/* 슬롯 카드 (페이지 오른쪽 카드와 동일) */
.slot-card{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:24px;background:#fff;overflow:hidden}
/* 페이지와 같이 위쪽 전체 띠 + SLOT 글자 */
.sc-head{display:block;padding:11px 0;background:var(--bell);text-align:center}
.sc-head .ghost{text-align:center}
.sc-head .ghost:hover,.sc-head input[type=text].ghost:hover,.sc-head textarea.ghost:hover{border-color:rgba(31,32,80,.35)}
.slot-pill{display:block;color:var(--on-bell);font:800 13px/1.3 var(--en);letter-spacing:.14em}
.slot-title{font-size:15px;font-weight:700}
.slot-date{font:800 28px var(--en)}
.slot-note{font-size:12.5px;font-weight:600}
.sc-body{padding:10px 12px 14px}
.srow{display:grid;grid-template-columns:70px 1fr auto auto auto;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid #EFEFF4}
/* 마감된 달 : 페이지와 같은 회색 배경 */
.srow.off{border-bottom-color:transparent;border-radius:10px;background:#F1F1F5}
.srow.off+.srow.off{margin-top:1px}
.srow.off .dot{background:#C6C7D6}
.ssel{width:auto;min-width:118px;padding:6px 8px;font-size:12.5px;font-weight:700}
.ssel.full{color:#8C8DAE}
.ssel.open{color:#4F7BD9}
.srow:last-child{border-bottom:0}
.sm{font:800 16px var(--en)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{position:relative;width:18px;height:23px;padding:0;border:0;background:var(--bell);clip-path:polygon(50.0% 0.0%,51.8% 5.0%,54.8% 10.0%,58.7% 15.0%,63.2% 20.0%,68.3% 25.0%,73.8% 30.0%,79.8% 35.0%,86.2% 40.0%,92.9% 45.0%,100.0% 50.0%,92.9% 55.0%,86.2% 60.0%,79.8% 65.0%,73.8% 70.0%,68.3% 75.0%,63.2% 80.0%,58.7% 85.0%,54.8% 90.0%,51.8% 95.0%,50.0% 100.0%,48.2% 95.0%,45.2% 90.0%,41.3% 85.0%,36.8% 80.0%,31.7% 75.0%,26.2% 70.0%,20.2% 65.0%,13.8% 60.0%,7.1% 55.0%,0.0% 50.0%,7.1% 45.0%,13.8% 40.0%,20.2% 35.0%,26.2% 30.0%,31.7% 25.0%,36.8% 20.0%,41.3% 15.0%,45.2% 10.0%,48.2% 5.0%);cursor:pointer;transition:transform .15s}
.dot:hover{transform:scale(1.15)}
.dot.empty::after{content:"";position:absolute;inset:2px 2.6px;background:#fff;clip-path:polygon(50.0% 0.0%,51.8% 5.0%,54.8% 10.0%,58.7% 15.0%,63.2% 20.0%,68.3% 25.0%,73.8% 30.0%,79.8% 35.0%,86.2% 40.0%,92.9% 45.0%,100.0% 50.0%,92.9% 55.0%,86.2% 60.0%,79.8% 65.0%,73.8% 70.0%,68.3% 75.0%,63.2% 80.0%,58.7% 85.0%,54.8% 90.0%,51.8% 95.0%,50.0% 100.0%,48.2% 95.0%,45.2% 90.0%,41.3% 85.0%,36.8% 80.0%,31.7% 75.0%,26.2% 70.0%,20.2% 65.0%,13.8% 60.0%,7.1% 55.0%,0.0% 50.0%,7.1% 45.0%,13.8% 40.0%,20.2% 35.0%,26.2% 30.0%,31.7% 25.0%,36.8% 20.0%,41.3% 15.0%,45.2% 10.0%,48.2% 5.0%)}
.tot{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:11.5px}
.tot b{min-width:18px;color:var(--ink);text-align:center}
.ss{font-size:13px;font-weight:700;min-width:62px;text-align:right}
.ss.full{color:#A9AABF}
.ss.open{color:#4F7BD9}
.sc-body .note{margin:8px 4px 0}

/* 공지 (페이지와 동일한 번호 목록 / 접이식) */
.notice{display:grid;gap:10px}
.notice li{display:flex;gap:14px;align-items:flex-start;padding:10px 16px;border-radius:14px;background:var(--panel)}
.notice li::before{content:"";flex:none;width:9px;height:15px;margin-top:9px;background:var(--bell);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.n{flex:none;display:block;width:26px;height:26px;border-radius:50%;background:var(--bell);color:var(--on-bell);font:800 12px/26px var(--en);text-align:center}
.notice textarea{flex:1}
/* 공지사항 1~6 · 자주하는 질문 : 페이지와 같은 연보라 상자 (제목은 연보라, 내용은 흰 바탕) */
.ai{border:1.5px solid var(--panel);border-radius:14px;background:#fff;overflow:hidden}
.ai+.ai{margin-top:12px}
.ai .ah{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--panel)}
.ai .ah .ghost{font-size:15px;font-weight:700}
.ai .apin{padding:12px 12px 12px 46px}
.qa{flex:none;width:26px;color:var(--bell-deep);font:800 15px/1 var(--en);text-align:center}
.qa-a{position:absolute;margin:8px 0 0 -30px}
.faq .apin{position:relative}
/* 가격 묶음은 페이지처럼 회색 상자 */
.optbox{border-color:#E6E6EC;background:#FBFBFC}
.optbox .ah{background:none}
.optbox .apin{padding-left:12px}

/* 가격 (페이지와 동일한 카드) */
.ptabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.ptab{padding:9px 22px;border:1px solid #D5D6EE;border-radius:999px;background:#fff;font:700 12px var(--en);letter-spacing:.1em}
.ptab[aria-selected="true"]{border-color:var(--bell);background:var(--bell);color:var(--on-bell)}
.pgl{margin:0 0 10px;color:var(--sub);font-size:12.5px;font-weight:700}
.pcs,.opts{display:grid;gap:10px}
.pc,.oc{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.pc.off{border-color:transparent;background:#E9E9F1}
.pk{flex:none;width:18px;height:18px;margin-top:8px;border:1.5px solid #B9BBD8;border-radius:4px;background:#fff}
.pb{flex:1;min-width:0;display:grid;gap:4px}
.pn{font-size:14.5px;font-weight:700}
.pb .ds{font-size:12px;color:var(--sub)}
.pl2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.pl2 .pp{width:150px;font-size:16px;font-weight:800}
.chk,.pl2 label.chk{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:12px;font-weight:600}
.oc .row3{display:grid;grid-template-columns:1fr 1fr 130px;gap:6px}
.oc .row4{display:flex;gap:14px;align-items:center;margin-top:6px;font-size:12px;color:var(--sub)}
.optgroups .optbox{margin-top:12px}
.notes{display:grid;gap:4px;margin-top:16px}
.notes::before{content:"※ 안내 문구 (한 줄에 하나)";color:var(--sub);font-size:12px}
.notes textarea{font-size:12.5px;color:var(--sub)}
.optbox{margin-top:18px}
.optbox .ah{padding:12px 16px 4px}

/* 일러스트 / 리깅 뷰어 (페이지와 동일) */
.gtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.tab{padding:8px 20px;border:1px solid #D5D6EE;border-radius:999px;background:#fff;color:var(--sub);font:700 12px var(--en);letter-spacing:.1em}
.tab[aria-selected="true"]{border-color:var(--bell);background:var(--bell);color:var(--on-bell)}
.tab.dis{border-color:#E8E8F0;background:#EFEFF5;color:#B6B7CC}
.tab.dis[aria-selected="true"]{border-color:var(--bell);background:var(--chalk);color:var(--bell-deep)}
.gcard{border:0;border-radius:20px;background:#fff;overflow:hidden}
.viewer{position:relative;display:grid;place-items:center;aspect-ratio:4/5;width:min(100%,460px);margin:16px auto;border:1.5px solid #D9DAF4;border-radius:22px;overflow:hidden;background:#FAFAFE}
.viewer.wide{width:auto;margin:16px;border-radius:22px}
.viewer.wide{aspect-ratio:16/9}
.viewer img{display:block;width:100%;height:100%;object-fit:contain}
.viewer.wide img{object-fit:cover}
.ph{display:grid;place-items:center;width:100%;height:100%;background:repeating-linear-gradient(135deg,#F6F6FF 0 12px,#EFEFFC 12px 24px);color:#8F90B6;font-size:13px;text-align:center}
/* 화살표 : 페이지와 같은 흰 원 + 연보라 */
.nav{position:absolute;top:50%;z-index:2;display:grid;place-items:center;width:44px;height:44px;margin-top:-22px;padding:0;border:1.5px solid #CFD0EE;border-radius:50%;background:rgba(255,255,255,.96);color:var(--bell);font-size:22px;line-height:1}
.nav:hover{border-color:var(--bell);background:var(--chalk)}
.nav.prev{left:14px}.nav.next{right:14px}
.gmeta{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 16px 12px}
.gmeta select{width:150px}
.platpick{display:flex;flex-wrap:wrap;gap:4px 12px;max-width:340px}
.gmeta .nick{max-width:260px;font-size:15px;font-weight:700;text-align:center}
.gmeta.one{padding-top:0;border-top:0}
.gthumbs{display:flex;gap:8px;padding:10px 16px 14px;overflow-x:auto}
.gthumbs>:first-child{margin-left:auto}.gthumbs>:last-child{margin-right:auto}
.thumb{flex:none;width:72px;aspect-ratio:1;padding:0;border:2px solid transparent;border-radius:10px;background:var(--panel);overflow:hidden;opacity:.7}
.thumb[aria-current="true"]{border-color:var(--bell);opacity:1}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:12px}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.gtools input[type=text].ghost{flex:1;min-width:160px;border-color:#E3E3F6}
.badge-new{padding:1px 8px;border-radius:999px;background:var(--bell);color:var(--on-bell);font-size:11px;font-weight:800}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.th{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center}
.th .im{aspect-ratio:2/1;border-radius:8px;background:#fff;overflow:hidden;display:grid;place-items:center;color:#9B9CB5;font-size:12px}
.th .im img{width:100%;height:100%;object-fit:contain;padding:8px}
.th .tl .btn{flex:1;padding:4px 0}
/* 리깅 영상 목록 (주소만 입력) */
.rlist{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:24px 112px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.rnum{font:800 13px var(--en);color:var(--sub);text-align:center}
.rthumb{display:grid;place-items:center;aspect-ratio:16/9;border-radius:8px;background:var(--panel);color:#9B9CB5;font-size:11px;overflow:hidden}
.rthumb img{display:block;width:100%;height:100%;object-fit:cover}
.rthumb.sq{aspect-ratio:1;width:72px;justify-self:center}
@media(max-width:720px){.rrow{grid-template-columns:20px 84px minmax(0,1fr)}.rrow .tools{grid-column:2 / -1;justify-content:flex-end}}
code{padding:1px 6px;border-radius:6px;background:var(--chalk);font-size:12.5px}
ol.steps{margin:8px 0 0 18px;display:grid;gap:4px;font-size:13px;list-style:decimal}
.card{padding:26px;border:1px solid var(--line);border-radius:20px;background:#fff}
.card h2{margin-bottom:14px;font-size:17px}
@media(max-width:720px){.grid2,.oc .row3{grid-template-columns:1fr}.srow{grid-template-columns:60px 1fr auto}.sec{padding:22px 16px}.ss{display:none}}
</style>
</head>
<body>
<header class="top">
  <h1>LEUIN · 관리자</h1>
  <div class="actions">
    <span id="status" role="status"></span>
    <button type="button" class="btn" id="btnReload">다시 불러오기</button>
    <button type="button" class="btn" id="btnDl">data.json 다운로드</button>
    <button type="button" class="btn primary" id="btnSave">저장 및 게시</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="main"></main>

<script src="defaults.js"></script>
<script>
(function () {
  'use strict';
  var D = window.LEUIN_DEFAULTS;
  var CFG_KEY = 'leuin-admin-cfg-v1';
  var S = clone(D), pending = {}, dirty = false;
  var tab = 'slots', pTab = 0, gId = 'ill:0', busy = 0;

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function $(id) { return document.getElementById(id); }

  /* ---------- DOM 헬퍼 ---------- */
  function h(tag, a, kids) {
    var e = document.createElement(tag);
    a = a || {};
    Object.keys(a).forEach(function (k) {
      var v = a[k];
      if (v === false || v == null) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'value') e.value = v;
      else if (k === 'checked') e.checked = !!v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function touch() { dirty = true; setStatus('저장되지 않은 변경 사항이 있습니다.', ''); }
  function setStatus(msg, cls) { var s = $('status'); s.textContent = msg; s.className = cls || ''; }
  function field(label, input) { return h('label', { class: 'field' }, [h('span', { text: label }), input]); }
  function card(title, kids, hint) {
    var c = h('section', { class: 'card' }, [h('h2', { text: title })]);
    if (hint) c.appendChild(h('p', { class: 'hint', text: hint }));
    kids.forEach(function (k) { c.appendChild(k); });
    return c;
  }
  function inp(obj, key, extra) {
    return h('input', Object.assign({ type: 'text', value: obj[key] == null ? '' : obj[key], oninput: function (e) { obj[key] = e.target.value; touch(); } }, extra || {}));
  }
  function ta(obj, key, rows) {
    return h('textarea', { rows: rows || 3, value: obj[key] == null ? '' : obj[key], oninput: function (e) { obj[key] = e.target.value; touch(); } });
  }
  function lines(arr, rows) {
    return h('textarea', { rows: rows || 3, value: (arr || []).join('\n'), oninput: function (e) {
      arr.length = 0;
      e.target.value.split('\n').forEach(function (l) { if (l.trim()) arr.push(l.trim()); });
      touch();
    } });
  }
  function priceInp(obj, key) {
    return h('input', { type: 'text', value: obj[key] == null ? '' : obj[key],
      oninput: function (e) { obj[key] = e.target.value; touch(); },
      onblur: function (e) {
        var v = e.target.value.trim();
        if (/^[\d,]+$/.test(v) && v) { v = String(parseInt(v.replace(/,/g, ''), 10)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); if (/^0+$/.test(v.replace(/,/g, ''))) v = e.target.value.trim(); }
        e.target.value = v; obj[key] = v;
      } });
  }
  function move(arr, i, d) {
    var j = i + d;
    if (j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t; touch(); render();
  }
  function del(arr, i, what) {
    if (!confirm((what || '이 항목') + '을(를) 삭제할까요?')) return;
    arr.splice(i, 1); touch(); render();
  }
  function tools(arr, i, what) {
    return h('div', { class: 'tools' }, [
      h('button', { type: 'button', class: 'btn sm', text: '↑', title: '위로', onclick: function () { move(arr, i, -1); } }),
      h('button', { type: 'button', class: 'btn sm', text: '↓', title: '아래로', onclick: function () { move(arr, i, 1); } }),
      h('button', { type: 'button', class: 'btn sm danger', text: '삭제', onclick: function () { del(arr, i, what); } })
    ]);
  }

  /* ---------- 탭 ---------- */

  function processImage(file) {
    /* mp4 · webm 영상은 그대로 올립니다 (페이지에서 자동 반복 재생) */
    var vm = file && ((file.type || '').indexOf('video/') === 0 || /\.(mp4|webm|mov)$/i.test(file.name || '')) ? (/\.webm$/i.test(file.name || '') || file.type === 'video/webm' ? 'webm' : 'mp4') : '';
    if (vm) {
      if (file.size > 25 * 1024 * 1024) return Promise.reject(new Error(file.name + ' 이(가) 25MB 를 넘습니다. 용량을 줄여 다시 올려 주세요.'));
      return Promise.resolve({ path: 'images/p-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + '.' + vm, blob: file, url: URL.createObjectURL(file) });
    }
    /* GIF 는 캔버스로 바꾸면 움직임이 사라지므로 그대로 올립니다 */
    /* 파일 형식 정보가 비어 있는 경우가 있어 확장자(.gif)로도 확인합니다 */
    if (file && (file.type === 'image/gif' || /\.gif$/i.test(file.name || ''))) {
      if (file.size > 25 * 1024 * 1024) return Promise.reject(new Error(file.name + ' 이(가) 25MB 를 넘습니다. 용량을 줄여 다시 올려 주세요.'));
      return Promise.resolve({ path: 'images/p-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + '.gif', blob: file, url: URL.createObjectURL(file) });
    }
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 2000, w = img.naturalWidth, hh = img.naturalHeight, r = Math.min(1, max / Math.max(w, hh));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * r); cv.height = Math.round(hh * r);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (blob) {
          if (!blob) return reject(new Error('변환 실패'));
          var ext = blob.type === 'image/webp' ? 'webp' : 'png';
          var path = 'images/p-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + '.' + ext;
          resolve({ path: path, blob: blob, url: URL.createObjectURL(blob) });
        }, 'image/webp', 0.9);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error(file.name + ' 을(를) 읽을 수 없습니다.')); };
      img.src = url;
    });
  }
  function addFiles(items, files, rig) {

    setStatus('이미지 처리 중… (' + list.length + '장)', '');

          pending[r.path] = { blob: r.blob, url: r.url };
          /* 빈 칸이 있으면 먼저 채우고, 없으면 뒤에 추가 */
          var empty = items.filter(function (x) { return !x.src; })[0];
          if (empty) { empty.src = r.path; } else { var ni = newItem(rig); ni.src = r.path; items.push(ni); }
        });
      });
    }, Promise.resolve()).then(function () { busy--; touch(); render(); }, function (e) { busy--; setStatus(e.message, 'err'); render(); });
  }

  /* ---------- GitHub 연결 ---------- */
  function guessCfg() {
    var host = location.hostname, parts = location.pathname.split('/').filter(Boolean);
    var o = { owner: 'mororororo', repo: 'artmug', branch: 'main', token: '' };
    if (/\.github\.io$/.test(host)) { o.owner = host.split('.')[0]; o.repo = parts.length > 1 ? parts[0] : host; }
    return o;
  }
  function getCfg() {
    try { var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (c) return Object.assign(guessCfg(), c); } catch (e) {}
    return guessCfg();
  }
  function setCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }

  function api(method, path, body, accept) {
    var c = getCfg();
    var headers = { 'Authorization': 'Bearer ' + c.token, 'Accept': accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (body) headers['Content-Type'] = 'application/json';
    /* cache:'no-store' : 브라우저가 GitHub 응답(파일 버전 sha)을 1분간 기억해 두면, 방금 바뀐 파일을
       예전 sha 로 저장하려다 '충돌'이 납니다. 항상 최신 응답을 받도록 캐시를 쓰지 않습니다. */
    return fetch('https://api.github.com/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + path,
      { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  }
  function explain(status) {
    if (status === 401) return '토큰이 올바르지 않거나 만료되었습니다. (GitHub 연결 탭 확인)';
    if (status === 403) return '이 토큰으로는 저장할 수 없습니다. 토큰의 Contents 권한이 "Read and write"인지 확인하세요.';
    if (status === 404) return '저장소를 찾을 수 없습니다. 아이디·저장소 이름·브랜치와 토큰의 저장소 선택을 확인하세요.';
    if (status === 409 || status === 422) return '다른 변경과 충돌했습니다. 잠시 뒤 "저장 및 게시"를 한 번 더 눌러 주세요.';
    return 'GitHub 오류 (' + status + ')';
  }
  function checkCfg() {
    var c = getCfg();
    if (!c.token || !c.owner || !c.repo) { setStatus('먼저 "GitHub 연결" 탭에서 아이디, 저장소, 토큰을 입력해 주세요.', 'err'); tab = 'connect'; render(); return null; }
    return c;
  }
  function testConn() {
    var c = checkCfg(); if (!c) return;
    setStatus('연결 확인 중…', '');
    api('GET', '/contents/data.json?ref=' + encodeURIComponent(c.branch)).then(function (r) {
      if (r.status === 200 || r.status === 404) setStatus(r.status === 200 ? '연결되었습니다. (data.json 확인)' : '연결되었습니다. (아직 data.json 이 없어 첫 저장 때 만들어집니다)', 'ok');
      else setStatus(explain(r.status), 'err');
    }, function () { setStatus('네트워크 오류입니다.', 'err'); });
  }

  function b64utf8(str) { return btoa(unescape(encodeURIComponent(str))); }
  function blobB64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }
  function getSha(c, path) {
    return api('GET', '/contents/' + path + '?ref=' + encodeURIComponent(c.branch)).then(function (r) {
      if (r.status === 200) return r.json().then(function (j) { return j.sha; });
      if (r.status === 404) return undefined;
      throw new Error(explain(r.status));
    });
  }
  function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
  /* 저장 : 매번 최신 sha 를 받아서 저장하고, 그 사이 다른 저장이 끼어들어 충돌하면 최신 sha 로 최대 4번 다시 시도 */
  function putFile(c, path, b64, msg, withSha, tries) {
    tries = tries || 0;
    return getSha(c, path).then(function (sha) {
      var body = { message: msg, content: b64, branch: c.branch };
      if (sha) body.sha = sha;
      return api('PUT', '/contents/' + path, body).then(function (r) {
        if ((r.status === 409 || r.status === 422) && tries < 4) return wait(700 * (tries + 1)).then(function () { return putFile(c, path, b64, msg, withSha, tries + 1); });
        if (!r.ok) throw new Error(explain(r.status));
      });
    });
  }
  function usedSrcs() {
    var all = [];
    S.gallery.illustration.forEach(function (c) { c.items.forEach(function (i) { all.push(i.src); }); });
    rigCats(S.gallery.rigging).forEach(function (c) { (c.items || []).forEach(function (i) { all.push(i.src); }); });
    var lg = (S.platforms && S.platforms.logos) || {};
    Object.keys(lg).forEach(function (k) { all.push(lg[k]); });
    return all;
  }
  function clean() {
    /* 월 라벨 공백 정리 등 가벼운 정리 */
    S.slots.months.forEach(function (m) { delete m.status; m.label = String(m.label || '').trim(); m.total = Math.max(0, parseInt(m.total, 10) || 0); m.booked = Math.min(m.total, Math.max(0, parseInt(m.booked, 10) || 0)); });
  }
  function save() {
    if (busy) { setStatus('이미지 처리가 끝난 뒤 다시 눌러 주세요.', 'err'); return; }
    var c = checkCfg(); if (!c) return;
    clean();
    var btn = $('btnSave'); btn.disabled = true;
    var used = usedSrcs();
    var paths = Object.keys(pending).filter(function (p) { return used.indexOf(p) >= 0; });
    var n = 0;
    setStatus('저장 중…', '');
    paths.reduce(function (p, path) {
      return p.then(function () {
        n++; setStatus('이미지 올리는 중… (' + n + '/' + paths.length + ')', '');
        return blobB64(pending[path].blob).then(function (b64) { return putFile(c, path, b64, 'Add image', false); }).then(function () { delete pending[path]; });
      });
    }, Promise.resolve()).then(function () {
      setStatus('data.json 저장 중…', '');
      return putFile(c, 'data.json', b64utf8(JSON.stringify(S, null, 2) + '\n'), 'Update data.json', true);
    }).then(function () {
      dirty = false;
      setStatus('저장되었습니다. 페이지에는 보통 1~3분 뒤 반영됩니다.', 'ok');
      btn.disabled = false; render();
    }, function (e) {
      setStatus((e && e.message) || '저장에 실패했습니다.', 'err');
      btn.disabled = false;
    });
  }

  function download() {
    clean();
    var blob = new Blob([JSON.stringify(S, null, 2) + '\n'], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'data.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setStatus('data.json 을 내려받았습니다. 저장소의 data.json 을 이 파일로 교체해 주세요.', 'ok');
  }

  /* ---------- 불러오기 ---------- */
  function merge(d) {
    var o = clone(D);
    if (d && typeof d === 'object') Object.keys(d).forEach(function (k) { if (d[k] != null) o[k] = d[k]; });
    o.links = o.links || { post: '', inquiry: '' };
    o.platforms = o.platforms || { list: [], logos: {} };
    o.platforms.logos = o.platforms.logos || {};
    o.gallery = o.gallery || { illustration: [], rigging: [] };
    o.gallery.rigging = rigCats(o.gallery.rigging);
    (o.gallery.illustration || []).forEach(function (c) { (c.items || []).forEach(platsOf); });
    return o;
  }
  function load() {
    var c = getCfg(), p;
    if (c.token && c.owner && c.repo) {
      p = api('GET', '/contents/data.json?ref=' + encodeURIComponent(c.branch), null, 'application/vnd.github.raw+json')
        .then(function (r) { return r.ok ? r.text().then(JSON.parse) : null; }).catch(function () { return null; });
    } else p = Promise.resolve(null);
    return p.then(function (d) {
      if (d) return d;
      return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }).then(function (d) {
      S = merge(d); pending = {}; dirty = false;
      setStatus(d ? '' : 'data.json 을 찾지 못해 기본값을 불러왔습니다.', '');
      render();
    });
  }

  $('btnSave').addEventListener('click', save);
  $('btnDl').addEventListener('click', download);
  $('btnReload').addEventListener('click', function () {
    if (dirty && !confirm('저장하지 않은 변경 사항이 사라집니다. 다시 불러올까요?')) return;
    load();
  });
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  render();
  load();
})();
</script>
</body>
</html>
